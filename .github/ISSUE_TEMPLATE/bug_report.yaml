name: Pool of Radiance Configurator bug report
description: Create a bug report for Pool of Radiance Configurator.
title: "[BUG] <title>"
labels: ["bug", "needs triage"]

body:
  - type: textarea
    attributes:
      label: Basic required information
      description: |
        examples:
          - Program version: 1.0
          - DOS or emulator version: MS-DOS 6.22
      value: |
        - Program version:
        - DOS or emulator version:
      render: markdown
    validations:
      required: true

  - type: textarea
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
      render: markdown
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the problem.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
        ...
      render: markdown
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      render: markdown
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files to it.
    validations:
      required: false
